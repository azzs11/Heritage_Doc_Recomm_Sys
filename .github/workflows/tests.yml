name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # src/ has ~320 pre-existing violations; fix those in a separate refactor/ branch.
      # Until then, enforce lint only on the directories we actively maintain.
      - name: Run ruff check
        run: uvx ruff check api/ tests/
      - name: Run ruff format check
        run: uvx ruff format --check api/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies only
        run: uv sync --only-group dev --frozen
      - name: Run tests
        run: uv run --group dev pytest tests/ -q
